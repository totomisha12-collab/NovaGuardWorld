prefix: '<gradient:#38BDF8:#A78BFA><bold>NovaGuardWORLD</bold></gradient> <dark_gray>»</dark_gray> '
no-permission: <#FF5C7A>У тебя недостаточно прав.
player-only: <#FF5C7A>Эта команда доступна только игроку.
help: '<aqua>Команды: <white>/ng wand, pos1, pos2, claim, auto, delete, info, list,
  trust, untrust, flag, flags, priority, greeting, farewell, view, reload'
reloaded: <green>Конфигурация и переводы перезагружены.
wand: <green>Инструмент выдан. ЛКМ — точка 1, ПКМ — точка 2.
point-set: <green>Точка {point} установлена.
claim-created: <green>Регион <white>{name}</white> успешно создан.
usage-claim: '<red>Использование: /ng claim <название>'
need-selection: <red>Сначала выдели две точки инструментом или командами /ng pos1
