  <white>{world}</white> | Участников: <white>{members}</white> | Приоритет: <white>{priority}'
usage-delete: '<red>Использование: /ng delete <название>'
not-found: <red>Регион не найден.
not-owner: <red>Ты не владелец этого региона.
deleted: <green>Регион <white>{name}</white> удалён.
usage-player: '<red>Использование: /ng trust|untrust <игрок>'
owner-trust: <red>Владелец уже имеет полный доступ.
trusted: <green>Игрок {player} добавлен в участники.
untrusted: <green>Игрок {player} удалён из участников.
usage-flag: '<red>Использование: /ng flag <название> <флаг> <allow|deny>'
invalid-flag: <red>Неизвестный флаг или значение. Используй /ng flags.
flag-set: '<green>Флаг {flag} установлен: {value}.'
flags-list: '<aqua>Доступные флаги: <white>{flags}'
usage-priority: '<red>Использование: /ng priority <число> (находясь в своём регионе)'
invalid-number: <red>Ожидалось целое число.
priority-set: '<green>Приоритет региона установлен: {value}.'
message-set: <green>Сообщение региона сохранено.
view-off: <gray>Отображение границ выключено.
view-on: <aqua>Границы региона будут показаны некоторое время.
protected: <red>Это действие запрещено защитой региона.
unknown-command: <red>Неизвестная команда. Используй /ng help.
overlap-warning: <yellow>Область пересекается с другим регионом. Доступ определяется
  приоритетом.
