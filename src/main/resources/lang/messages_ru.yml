different-worlds: <red>Точки должны находиться в одном мире.
invalid-name: '<red>Название: 1–32 символа, латиница, цифры, _ или -.'
too-large: '<red>Регион слишком большой. Объём: {size}.'
claim-limit: <red>Достигнут лимит регионов.
name-exists: <red>Регион с таким названием уже существует в этом мире.
overlap: <red>Регион пересекается с другим регионом.
invalid-radius: <red>Радиус должен быть числом от 1 до 64.
