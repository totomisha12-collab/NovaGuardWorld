name: Build NovaGuardWORLD
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Gradle wrapper
        run: test -x ./gradlew
      - name: Build plugin
        run: ./gradlew clean build
      - uses: actions/upload-artifact@v4
        with:
          name: NovaGuardWORLD
          path: build/libs/NovaGuardWORLD-*.jar
          if-no-files-found: error
