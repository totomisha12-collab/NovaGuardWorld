name: Build NovaGuardWORLD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Locate project and prepare Gradle launcher
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            PROJECT_DIR="."
          elif [[ -f ./NovaGuardWORLD/gradlew ]]; then
            PROJECT_DIR="./NovaGuardWORLD"
          else
            PROJECT_DIR="$(dirname "$(find . -maxdepth 4 -type f -name gradlew -print -quit)")"
          fi
          if [[ -z "$PROJECT_DIR" || ! -f "$PROJECT_DIR/gradlew" ]]; then
            echo "Gradle launcher was not found in the repository." >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"
          test -x "$PROJECT_DIR/gradlew"

      - name: Build plugin
        shell: bash
        run: ./gradlew --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaGuardWORLD
          path: ${{ env.PROJECT_DIR }}/build/libs/NovaGuardWORLD-*.jar
          if-no-files-found: error
